[package]
name = "spacetime"
version = "0.0.1"
edition = "2021"
description = "A lightweight benchmark for terminal-using AI agents"
authors = ["Chaitanya"]

[dependencies]
tokio = { version = "1.43", features = ["full"] }
bollard = { version = "0.18", default-features = false, features = ["pipe", "http", "chrono"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = "0.3"
inquire = "0.7"
indicatif = "0.17"
colored = "3.0"
comfy-table = "7.1"
anyhow = "1.0"
dotenvy = "0.15"
regex = "1.11"
chrono = { version = "0.4", features = ["serde"] }
