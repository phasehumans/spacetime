[package]
name = "spacetime-cli"
version = "0.1.0"
edition = "2021"
authors = ["Phase Humans"]
description = "Minimalist framework for evaluating autonomous AI agents in isolated sandboxes"
license = "MIT"
default-run = "spacetime"

[[bin]]
name = "spacetime"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tokio = { version = "1.38", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
directories = "5.0"
rust-embed = { version = "8.4", features = ["include-exclude"] }
tracing = "0.1"
tracing-subscriber = "0.3"
bollard = "0.18"
futures-util = "0.3"

[dev-dependencies]
tempfile = "3.10"
