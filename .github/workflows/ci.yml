name: CI

on:
  push:
    branches:
      - main
      - trim-down
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (C11)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile C binary
        run: make

      - name: Run C unit tests
        run: make test

  sandbox-docker:
    name: Verify Sandbox Dockerfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Sandbox Docker Image
        run: docker build -t spacetime-sandbox:ci .
